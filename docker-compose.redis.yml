# Optional overlay after the SQLite base (and MySQL overlay, if used).
services:
  one-hub:
    environment:
      REDIS_CONN_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
    container_name: redis
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - response=$$(redis-cli --raw ping) && [ "$$response" = PONG ]
      interval: 10s
      timeout: 5s
      retries: 5
