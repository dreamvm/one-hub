name: Manual GHCR image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag on main (for example v0.14.27-dreamvm.1)'
        required: true
        type: string
      publish:
        description: 'Upload to GHCR after validation and tests; false only builds'
        required: true
        default: false
        type: boolean
      platforms:
        description: 'Image architectures'
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: read

concurrency:
  group: manual-ghcr-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
      image: ${{ steps.version.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out dispatch revision and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo 'Invalid version tag; use vX.Y.Z or vX.Y.Z-suffix.' >&2
            exit 1
          fi
          source_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'source_sha=%s\nimage=ghcr.io/%s\nversion=%s\n' "$source_sha" "$image_name" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    uses: ./.github/workflows/gemini-compatibility.yml
    with:
      ref: ${{ needs.resolve.outputs.source_sha }}

  image:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Set build version
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
        run: printf '%s\n' "$BUILD_VERSION" > VERSION
      - name: Set up QEMU
        if: inputs.platforms == 'linux/amd64,linux/arm64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR only for explicit publishing
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and optionally publish
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.image }}:sha-${{ needs.resolve.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record build result
        env:
          IMAGE_NAME: ${{ needs.resolve.outputs.image }}
          IMAGE_VERSION: ${{ needs.resolve.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PUBLISHED: ${{ inputs.publish }}
        run: |
          printf 'Image: %s:%s\n\nSource: %s\n\nDigest: %s\n\nPublished: %s\n' "$IMAGE_NAME" "$IMAGE_VERSION" "$SOURCE_SHA" "$IMAGE_DIGEST" "$PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
