name: Gemini compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/gemini-thought-signature'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Exact source commit to test before a manual image build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-compatibility-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  quota-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1
        env:
          MYSQL_ROOT_PASSWORD: quota-fixture-root
          MYSQL_DATABASE: onehub_quota_test
          MYSQL_USER: onehub_quota_test
          MYSQL_PASSWORD: quota-fixture-password
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c # 18.0
        env:
          POSTGRES_DB: onehub_quota_test
          POSTGRES_USER: onehub_quota_test
          POSTGRES_PASSWORD: quota-fixture-password
        ports:
          - 35432:5432
        options: >-
          --health-cmd="pg_isready -U onehub_quota_test -d onehub_quota_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache: true
      - name: Verify atomic quota operations on all supported databases
        run: |
          test -z "$(gofmt -l controller/oidc.go controller/oidc-claims_test.go controller/order.go controller/order-amount.go model/payment-admission_test.go model/payment-native_test.go model/payment-lifecycle_test.go model/payment-stripe-registration_test.go model/payment.go payment/service.go payment/service_test.go payment/gateway/alipay/payment.go payment/gateway/epay/payment.go payment/gateway/stripe/payment.go payment/gateway/wxpay/payment.go model/order.go model/payment-transaction_test.go model/payment-facts.go model/payment-facts_test.go model/payment-provider_test.go model/payment-rotation_test.go payment/gateway/wxpay/runtime.go payment/types/types.go payment/gateway/alipay/client.go payment/gateway/wxpay/client.go model/redemption.go model/recharge.go model/redemption-transaction_test.go model/quota-compensation.go model/quota-compensation_test.go model/task-poll.go model/token.go model/quota-reservation.go model/quota-reservation_test.go model/quota-transaction_test.go model/quota-identity_test.go)"
          for engine in sqlite mysql postgres; do
            ONEHUB_QUOTA_TEST_DB="$engine" go test -mod=readonly -race -count=1 -timeout=300s -v ./model -run '^TestQuotaTransaction'
          done

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          printf 'GITLEAKS_BIN=%s/gitleaks\n' "$tool_dir" >> "$GITHUB_ENV"
      - name: Scan full history without exposing findings
        run: python3 .github/security/check_secrets.py --history
      - name: Verify staged-secret and Docker-context boundaries
        env:
          ONEHUB_DOCKER_TEST: '1'
        run: python3 -m unittest discover -s .github/security -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    container: node:22.20
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install locked frontend dependencies
        working-directory: web
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run isolated UI regressions
        working-directory: web
        run: yarn test
      - name: Lint and build frontend
        working-directory: web
        run: |
          yarn lint
          yarn build

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache: true
      - name: Check formatting of patched Go files
        run: |
          test -z "$(gofmt -l types/common.go types/usage-arithmetic.go types/usage-arithmetic_test.go types/events.go types/chat.go types/responses.go types/tool-contract.go types/tool-contract_test.go types/chat-tool-metadata_test.go providers/gemini/type.go providers/gemini/chat.go providers/gemini/tool-contract.go providers/gemini/tool-contract_test.go providers/gemini/thought-signature_test.go .github/tests/release-policy_test.go .github/tests/deployment_test.go .github/tests/build-entry_test.go .github/tests/compose-config_test.go)"
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install pinned Task for build-entry regression
        run: |
          GOBIN="$RUNNER_TEMP/onehub-tools" go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "ONEHUB_TASK_BIN=$RUNNER_TEMP/onehub-tools/task" >> "$GITHUB_ENV"
      - name: Install pinned Compose for offline template checks
        run: |
          bash .github/smoke/install-compose.sh "$RUNNER_TEMP/onehub-compose"
          echo "ONEHUB_COMPOSE_BIN=$RUNNER_TEMP/onehub-compose/docker-compose" >> "$GITHUB_ENV"
      - name: Verify manual-release policy
        run: go test -count=1 ./.github/tests
      - name: Test isolated-smoke fixtures without Docker or external APIs
        if: hashFiles('.github/smoke/run.py') != ''
        run: |
          test -z "$(gofmt -l .github/smoke/mockserver)"
          go test -race -count=1 ./.github/smoke/...
          python3 -m unittest discover -s .github/smoke -p 'test_*.py'
      - name: Run offline signature and tool-call regressions
        run: |
          test -z "$(gofmt -l providers/claude providers/gemini/stream-tools.go providers/gemini/stream-tools_test.go common/requester/http_requester.go common/requester/http_stream_reader.go common/requester/http_stream_reader_test.go common/requester/stream-error.go common/requester/ws_proxy.go common/requester/ws_proxy_test.go providers/openai/realtime.go)"
          go test -race -count=1 ./types ./providers/gemini ./providers/claude ./common/requester
      - name: Test media destination policy without external services
        run: |
          test -z "$(gofmt -l common/image/http.go common/image/media_transport.go common/image/export_test.go common/image/media_*test.go)"
          go test -race -count=1 ./common/image -run '^(TestMedia.*|TestParseBase64File)$'
          go vet ./common/image
      - name: Test Midjourney notification, task binding and image boundaries
        run: |
          test -z "$(gofmt -l relay/midjourney/boundary.go relay/midjourney/boundary_test.go relay/midjourney/relay-mj.go controller/midjourney.go controller/midjourney-task-group.go controller/midjourney-boundary_test.go controller/export_test.go)"
          go test -race -count=1 ./relay/midjourney
          go vet ./relay/midjourney
      - name: Test search admission before upstream calls
        run: |
          test -z "$(gofmt -l relay/search.go relay/export_test.go relay/search-quota_test.go relay/realtime.go relay/realtime-quota_test.go)"
          go test -race -count=1 ./relay
          go vet ./relay
      - name: Compile all providers and relay code
        run: go build ./providers/... ./relay/...
      - name: Test grouped channel search, token authority and quota lifecycle
        run: |
          test -z "$(gofmt -l controller/oidc.go controller/oidc-claims_test.go controller/order.go controller/order-amount.go model/payment-admission_test.go model/payment-native_test.go model/payment-lifecycle_test.go model/payment-stripe-registration_test.go model/payment.go payment/service.go payment/service_test.go payment/gateway/alipay/payment.go payment/gateway/epay/payment.go payment/gateway/stripe/payment.go payment/gateway/wxpay/payment.go model/order.go model/payment-transaction_test.go model/payment-facts.go model/payment-facts_test.go model/payment-provider_test.go model/payment-rotation_test.go payment/gateway/wxpay/runtime.go payment/types/types.go payment/gateway/alipay/client.go payment/gateway/wxpay/client.go model/redemption.go model/recharge.go model/redemption-transaction_test.go controller/redemption.go model/channel.go model/channel-search_test.go model/user_group.go model/cache.go model/token-authority_test.go model/export_test.go model/quota-lifecycle_test.go model/quota-callers_test.go model/quota-high-balance_test.go model/quota-cache_test.go model/quota-identity_test.go model/quota-realtime_test.go model/quota-price-admission_test.go model/quota-settlement-arithmetic_test.go model/quota-ledger_test.go model/quota-background_test.go model/quota-compensation.go model/quota-compensation_test.go model/task-poll.go model/task.go model/midjourney.go model/quota-reservation.go model/quota-reservation_test.go model/main.go relay/relay_util/quota.go relay/relay_util/quota-arithmetic.go relay/task/main.go relay/task/task.go relay/task/task-group_test.go relay/task/suno/submit.go relay/task/kling/submit.go providers/kling/fetch.go providers/providers.go)"
          go test -race -count=1 ./model ./relay/task ./payment/...
          test -z "$(gofmt -l common/token.go common/token-image-quota_test.go)"
          go test -race -count=1 ./common -run '^TestImageQuotaEstimate'
          go vet ./relay/relay_util ./relay/task
      - name: Test credentials, current sessions and safe request logging
        run: |
          test -z "$(gofmt -l model/user.go model/user-response.go controller/user.go controller/user-response_test.go middleware/auth.go middleware/session.go middleware/session-auth_test.go controller/github.go controller/lark.go controller/oauth-session_test.go middleware/logger.go middleware/logger_test.go middleware/recover.go main.go)"
          go test -race -count=1 ./controller ./middleware
          go vet ./controller ./middleware ./model
      - name: Vet patched packages
        run: go vet ./types ./providers/gemini ./providers/claude ./common/requester
