name: Gemini compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/gemini-thought-signature'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Exact source commit to test before a manual image build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-compatibility-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check formatting of patched Go files
        run: |
          test -z "$(gofmt -l types/chat.go types/chat-tool-metadata_test.go providers/gemini/type.go providers/gemini/thought-signature_test.go .github/tests/release-policy_test.go)"
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify manual-release policy
        run: go test -count=1 ./.github/tests
      - name: Test isolated-smoke fixtures without Docker or external APIs
        if: hashFiles('.github/smoke/run.py') != ''
        run: |
          test -z "$(gofmt -l .github/smoke/mockserver)"
          go test -race -count=1 ./.github/smoke/...
          python3 -m unittest discover -s .github/smoke -p 'test_*.py'
      - name: Run offline signature and tool-call regressions
        run: go test -race -count=1 ./types ./providers/gemini
      - name: Compile all providers and relay code
        run: go build ./providers/... ./relay/...
      - name: Vet patched packages
        run: go vet ./types ./providers/gemini
