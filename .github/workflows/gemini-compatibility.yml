name: Gemini compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/gemini-thought-signature'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Exact source commit to test before a manual image build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-compatibility-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          printf 'GITLEAKS_BIN=%s/gitleaks\n' "$tool_dir" >> "$GITHUB_ENV"
      - name: Scan full history without exposing findings
        run: python3 .github/security/check_secrets.py --history
      - name: Verify staged-secret and Docker-context boundaries
        env:
          ONEHUB_DOCKER_TEST: '1'
        run: python3 -m unittest discover -s .github/security -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    container: node:22.20
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install locked frontend dependencies
        working-directory: web
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run isolated UI regressions
        working-directory: web
        run: yarn test
      - name: Lint and build frontend
        working-directory: web
        run: |
          yarn lint
          yarn build

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check formatting of patched Go files
        run: |
          test -z "$(gofmt -l types/chat.go types/responses.go types/tool-contract.go types/tool-contract_test.go types/chat-tool-metadata_test.go providers/gemini/type.go providers/gemini/chat.go providers/gemini/tool-contract.go providers/gemini/tool-contract_test.go providers/gemini/thought-signature_test.go .github/tests/release-policy_test.go)"
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify manual-release policy
        run: go test -count=1 ./.github/tests
      - name: Test isolated-smoke fixtures without Docker or external APIs
        if: hashFiles('.github/smoke/run.py') != ''
        run: |
          test -z "$(gofmt -l .github/smoke/mockserver)"
          go test -race -count=1 ./.github/smoke/...
          python3 -m unittest discover -s .github/smoke -p 'test_*.py'
      - name: Run offline signature and tool-call regressions
        run: |
          test -z "$(gofmt -l providers/claude providers/gemini/stream-tools.go providers/gemini/stream-tools_test.go common/requester/http_requester.go common/requester/http_stream_reader.go common/requester/http_stream_reader_test.go common/requester/stream-error.go)"
          go test -race -count=1 ./types ./providers/gemini ./providers/claude ./common/requester
      - name: Compile all providers and relay code
        run: go build ./providers/... ./relay/...
      - name: Test grouped channel search without external services
        run: |
          test -z "$(gofmt -l model/channel.go model/channel-search_test.go model/user_group.go)"
          go test -race -count=1 ./model
      - name: Vet patched packages
        run: go vet ./types ./providers/gemini ./providers/claude ./common/requester
