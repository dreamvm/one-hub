name: Isolated image smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/gemini-compatibility.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set isolated build version
        run: printf 'v0.0.0-smoke-%s\n' "$SOURCE_SHA" > VERSION
      - name: Set up Go for the offline mock upstream
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Compile the synthetic mock upstream
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -o "$RUNNER_TEMP/onehub-mock" ./.github/smoke/mockserver/cmd
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and load locally without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: onehub-isolated-smoke:${{ env.SOURCE_SHA }}
          cache-from: type=gha
      - name: Run isolated HTTP and persistence checks
        run: |
          python3 .github/smoke/run.py \
            --image "onehub-isolated-smoke:$SOURCE_SHA" \
            --mock-binary "$RUNNER_TEMP/onehub-mock" \
            --version "v0.0.0-smoke-$SOURCE_SHA"
