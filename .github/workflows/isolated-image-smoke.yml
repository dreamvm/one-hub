name: Isolated image smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/gemini-compatibility.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  smoke:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Public, immutable fixtures: One Hub v0.14.27, MySQL 8.2.0, Redis 8.8.0.
      OLD_IMAGE: martialbe/one-api@sha256:a498510e4b847ce59514c60463d505492fc0b627fa278703dba67be7839ae8a7
      MYSQL_IMAGE: mysql@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1
      POSTGRES_IMAGE: postgres@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c
      REDIS_IMAGE: redis@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set isolated build version
        run: printf 'v0.0.0-smoke-%s\n' "$SOURCE_SHA" > VERSION
      - name: Set up Go for the offline mock upstream
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache: true
      - name: Compile the synthetic mock upstream
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -tags 'netgo osusergo sqlite_omit_load_extension' -ldflags '-linkmode external -extldflags "-static"' -o "$RUNNER_TEMP/onehub-mock" ./.github/smoke/mockserver/cmd
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and load locally without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: onehub-isolated-smoke:${{ env.SOURCE_SHA }}
          cache-from: type=gha
      - name: Load immutable database and upgrade fixtures
        id: fixtures
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          for variable in OLD_IMAGE MYSQL_IMAGE POSTGRES_IMAGE REDIS_IMAGE; do
            reference="${!variable}"
            docker pull --platform "linux/$TARGET_ARCH" "$reference"
            [[ "$(docker image inspect --format '{{.Architecture}}' "$reference")" == "$TARGET_ARCH" ]]
            image_id="$(docker image inspect --format '{{.Id}}' "$reference")"
            [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s_ID=%s\n' "$variable" "$image_id" >> "$GITHUB_ENV"
          done
          [[ "$(docker image inspect --format '{{.Architecture}}' "onehub-isolated-smoke:$SOURCE_SHA")" == "$TARGET_ARCH" ]]
          candidate_id="$(docker image inspect --format '{{.Id}}' "onehub-isolated-smoke:$SOURCE_SHA")"
          [[ "$candidate_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'CANDIDATE_IMAGE_ID=%s\n' "$candidate_id" >> "$GITHUB_ENV"

      - name: Verify the final candidate compiler identity
        id: toolchain
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create --network none "$CANDIDATE_IMAGE_ID")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/one-api" "$RUNNER_TEMP/onehub-candidate"
          go run ./.github/smoke/buildinfo \
            -binary "$RUNNER_TEMP/onehub-candidate" \
            -go-version go1.25.14 -goarch "$TARGET_ARCH"

      - name: Run isolated SQLite checks
        id: sqlite
        timeout-minutes: 3
        run: |
          python3 .github/smoke/run.py \
            --image "onehub-isolated-smoke:$SOURCE_SHA" \
            --mock-binary "$RUNNER_TEMP/onehub-mock" \
            --version "v0.0.0-smoke-$SOURCE_SHA" \
            --backend sqlite

      - name: Run isolated MySQL and Redis checks
        id: mysql_redis
        timeout-minutes: 6
        run: |
          python3 .github/smoke/run.py \
            --image "onehub-isolated-smoke:$SOURCE_SHA" \
            --mock-binary "$RUNNER_TEMP/onehub-mock" \
            --version "v0.0.0-smoke-$SOURCE_SHA" \
            --backend mysql-redis \
            --mysql-image "$MYSQL_IMAGE_ID" \
            --redis-image "$REDIS_IMAGE_ID"

      - name: Run isolated PostgreSQL and Redis business checks
        id: postgres_redis
        timeout-minutes: 6
        run: |
          python3 .github/smoke/run.py \
            --image "onehub-isolated-smoke:$SOURCE_SHA" \
            --mock-binary "$RUNNER_TEMP/onehub-mock" \
            --version "v0.0.0-smoke-$SOURCE_SHA" \
            --backend postgres-redis \
            --postgres-image "$POSTGRES_IMAGE_ID" \
            --redis-image "$REDIS_IMAGE_ID"

      - name: Rehearse upgrade and both rollback paths
        id: upgrade
        timeout-minutes: 8
        run: |
          python3 .github/smoke/upgrade.py \
            --old-image "$OLD_IMAGE_ID" \
            --old-version v0.14.27 \
            --candidate-image "$CANDIDATE_IMAGE_ID" \
            --candidate-version "v0.0.0-smoke-$SOURCE_SHA" \
            --mysql-image "$MYSQL_IMAGE_ID" \
            --redis-image "$REDIS_IMAGE_ID" \
            --mock-binary "$RUNNER_TEMP/onehub-mock"

      - name: Exercise deployment templates with local images and disposable data
        timeout-minutes: 12
        run: |
          bash .github/smoke/install-compose.sh "$RUNNER_TEMP/onehub-compose"
          python3 .github/smoke/compose.py \
            --compose "$RUNNER_TEMP/onehub-compose/docker-compose" \
            --image "$CANDIDATE_IMAGE_ID" \
            --version "v0.0.0-smoke-$SOURCE_SHA"
