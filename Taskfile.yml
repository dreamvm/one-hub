# https://taskfile.dev

version: '3'

vars:
  GOPROXY: 'https://goproxy.cn,direct'
  GOSUMDB: sum.golang.google.cn
  ROOT_DIR: "{{.TASKFILE_DIR}}"
  BUILD_DIR: "{{.ROOT_DIR}}/_output"
  BIN_DIR: "{{.BUILD_DIR}}/one-hub"
  VERSION_PKG: one-api/common/config
  BUILD_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || printf dev
  BUILD_DATE:
    sh: git show -s --format=%cs HEAD 2>/dev/null | tr -d -
  GIT_BRANCH: $(git branch -r --contains | head -1 | sed -E -e "s%(HEAD ->|origin|upstream)/?%%g" | xargs)
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || printf unknown
  BUILD_RELEASE: "{{.BUILD_VERSION}}-{{.BUILD_DATE}}-{{.GIT_COMMIT}}"
  IMAGE: "one-hub:local"
  LOCAL_OS: $(go version | awk '{print $NF}')
  GOOS: $(go env GOOS)
  GOARCH: $(go env GOARCH)
  LDFLAGS: "-w -s \
    -X '{{.VERSION_PKG}}.Version={{.BUILD_VERSION}}' \
    -X '{{.VERSION_PKG}}.BuildTime={{.BUILD_DATE}}' \
    -X '{{.VERSION_PKG}}.Commit={{.GIT_COMMIT}}'"

tasks:
  web:
    desc: build current frontend using the committed Yarn lockfile
    env:
      ONEHUB_BUILD_VERSION: "{{.BUILD_VERSION}}"
    cmds:
      - bash hack/scripts/genui.sh "$ONEHUB_BUILD_VERSION"

  gomod:
    desc: update go mod
    cmds:
      - go mod tidy

  gofmt:
    cmds:
      - go install golang.org/x/tools/cmd/goimports@latest
      - gofmt -s -w .
      - goimports -w .

  golint:
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - golangci-lint run -v ./...

  lint:
    cmds:
      - task: gofmt
      - task: golint

  fmt:
    cmds:
      - task: gomod
      - task: gofmt
      - task: golint

  clean:
    desc: clean
    run: once
    cmds:
      - rm -rf web/build
      - rm -rf {{.BUILD_DIR}}

  run:
    desc: run
    deps:
      - build
    cmds:
      - "{{.BIN_DIR}}"

  build:
    desc: build frontend and backend without changing dependency manifests
    env:
      ONEHUB_BUILD_DIR: "{{.BUILD_DIR}}"
      ONEHUB_BIN_DIR: "{{.BIN_DIR}}"
      ONEHUB_LDFLAGS: "{{.LDFLAGS}}"
    cmds:
      - task: web
      - mkdir -p "$ONEHUB_BUILD_DIR"
      - go build -mod=readonly -trimpath -o "$ONEHUB_BIN_DIR" -ldflags "$ONEHUB_LDFLAGS"

  docker:
    desc: build a local image; publication uses the manual GHCR workflow
    env:
      ONEHUB_LOCAL_IMAGE: "{{.IMAGE}}"
    cmds:
      - docker build -t "$ONEHUB_LOCAL_IMAGE" .

  default:
    cmds:
      - task: build
