# Preserve the existing MySQL + Redis default. Keep all four templates together.
services:
  one-hub:
    extends:
      file: docker-compose.sqlite.yml
      service: one-hub
    environment:
      SQL_DSN: oneapi:${ONEHUB_MYSQL_PASSWORD:?Set the existing or generated database password}@tcp(db:3306)/one-api
      REDIS_CONN_STRING: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    extends:
      file: docker-compose.mysql.yml
      service: db
  redis:
    extends:
      file: docker-compose.redis.yml
      service: redis
